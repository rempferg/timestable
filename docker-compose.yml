services:
  db:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: timestable
      POSTGRES_USER: timestable
      POSTGRES_PASSWORD: timestable-internal-password
    volumes:
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/001_migrate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TIMESTABLE_DB_HOST: db
      TIMESTABLE_DB_NAME: timestable
      TIMESTABLE_DB_USER: timestable
      TIMESTABLE_DB_PASSWORD: timestable-internal-password
      TIMESTABLE_DB_PORT: 5432
      TIMESTABLE_DB_OPTIONS: -c timezone=UTC
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_RECIPIENTS: ${SMTP_RECIPIENTS}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-7000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
