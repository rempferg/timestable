<main class="legal-page">
  <nav class="legal-nav">
    <a
      class="back-button"
      [routerLink]="['/']"
      queryParamsHandling="preserve"
      aria-label="Zurück zur Startseite"
    >
      <span class="material-icons" aria-hidden="true">arrow_back</span>
      Zurück
    </a>
  </nav>

  <article class="legal-content">
    <h1>Impressum</h1>

    <p>
      Anbieterkennzeichnung gemäß &sect;&nbsp;5 DDG und Verantwortlich für den
      Inhalt nach &sect;&nbsp;18 Abs.&nbsp;2 MStV:
    </p>
    <p>
      Georg Rempfer<br>
      Dietrich-Bonhoeffer-Str. 8<br>
      71229 Leonberg
    </p>

    <h2>Kontakt:</h2>
    <p>
      E-Mail: <a href="mailto:kontakt&commat;1x1.rempfer.eu">kontakt&commat;1x1.rempfer.eu</a>
    </p>

    <h2>Kontaktformular</h2>
    <form class="contact-form" (ngSubmit)="sendMessage()">
      <label class="field">
        <span class="field-label">Dein Name</span>
        <input
          class="field-input"
          type="text"
          autocomplete="name"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
        >
      </label>

      <label class="field">
        <span class="field-label">Deine E-Mailadresse für Antworten</span>
        <input
          class="field-input"
          type="email"
          autocomplete="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        >
      </label>

      <label class="field">
        <span class="field-label">Nachricht</span>
        <textarea
          class="field-input"
          rows="5"
          [value]="content()"
          (input)="content.set($any($event.target).value)"
        ></textarea>
      </label>

      <button type="submit" class="send-button" [disabled]="sending()">
        {{ sending() ? 'Senden…' : 'Senden' }}
      </button>

      @if (status()) {
        <p class="form-status" role="status">{{ status() }}</p>
      }
    </form>
  </article>
</main>
