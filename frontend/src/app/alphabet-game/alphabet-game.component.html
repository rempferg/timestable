<div class="game">
  <div class="target" aria-hidden="true">{{ target() }}</div>
  <p class="sr-only" aria-live="polite">{{ announcement() }}</p>

  <div class="letter-row" role="group" aria-label="Buchstaben">
    @for (letter of letters; track letter; let i = $index) {
      <button
        type="button"
        class="tile"
        [class]="tileClass(i)"
        [disabled]="preview()"
        [attr.aria-label]="'Buchstabe ' + letter"
        (click)="onTileClick(i, $event)"
      >
        @if (isHit(i)) {
          @for (star of stars; track $index) {
            <span class="star" aria-hidden="true">★</span>
          }
        }
      </button>
    }
  </div>

  @if (!preview()) {
    <p class="hint">{{ hint() }}</p>
  }
</div>
